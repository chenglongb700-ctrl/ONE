<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2317212f'/><circle cx='15' cy='17' r='8' fill='none' stroke='white' stroke-width='2.4'/><circle cx='23.5' cy='8.5' r='3.4' fill='%237fa4ff'/></svg>" />
    <title>ONE · 个人管理</title>
    <script>
      // 在页面渲染前就定好主题，避免先白后黑地闪一下（逻辑和 src/theme.ts 一致）
      (function () {
        var t = null;
        try { t = localStorage.getItem("one-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
